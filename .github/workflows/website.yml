# Website handwerksdoktor.de: bei jedem Push bauen, prüfen und danach per SFTP zu IONOS hochladen.
# Läuft außerdem auf Knopfdruck und jede Nacht um etwa 3:17 Uhr UTC (dann ohne Berichte und ohne IndexNow).
#
# Ablauf:
#   1. prüfen:     npm ci, fehlende Titel- und Pin-Bilder erzeugen, Build (Astro + Pagefind), check (fremde Server, seitliches Scrollen),
#                  qualitaet (html-validate, pa11y-ci). Schlägt etwas fehl, wird NICHT hochgeladen.
#                  Dazu interne Links (lychee, offline): Ein kaputter Link auf der eigenen Seite verhindert den Upload.
#   2. hochladen:  dist/ per SFTP nach IONOS (Hauptordner /) (nur hinzufügen und überschreiben, nichts auf dem Server löschen),
#                  danach Live-Check und IndexNow.
#   3. berichte:   nur zur Info, blockiert nichts: externe Quellenlinks (lychee, ohne Amazon), Rechtschreibung der
#                  geänderten Artikel (LanguageTool) und Sicherheitslücken in den npm-Paketen (npm audit).
#                  Ergebnis steht in der Zusammenfassung des Laufs. Beim manuellen Start mit „alle_artikel“ alle Artikel prüfen.
#
# Zugangsdaten stehen ausschließlich als GitHub-Secrets im Repository (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD
# Optional als Variable (Reiter „Variables“): IONOS_SFTP_ZIEL. Standard ist /, denn bei IONOS liegt die Website
# für diesen SFTP-Benutzer direkt im Hauptordner (artikel/, bilder/, .htaccess …).
# Fehlen die Secrets, laufen nur die Prüfungen, der Upload wird mit einem Hinweis übersprungen.

name: Website prüfen und hochladen

on:
  push:
    branches: [claude/serene-darwin-f9rggj, main]
    paths: ['blog/site/**', '.github/workflows/website.yml']
  # Jede Nacht neu bauen und hochladen, damit zeitversetzte Pinterest-Pins (scripts/pin-varianten.mjs) im Feed erscheinen.
  # Hinweis: GitHub startet geplante Läufe nur aus dem Standard-Branch des Repositorys.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      hochladen:
        description: 'Nach den Prüfungen zu IONOS hochladen?'
        type: boolean
        default: true
      alle_artikel:
        description: 'Rechtschreibung aller Artikel prüfen (dauert einige Minuten)?'
        type: boolean
        default: false

permissions:
  contents: read

# Nie zwei Uploads gleichzeitig. Ein neuer Push wartet, bis der laufende fertig ist.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  pruefen:
    name: Bauen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: blog/site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog/site/package-lock.json

      - name: Pakete installieren
        run: npm ci

      - name: Chromium für die Prüfungen installieren
        run: |
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Fehlende Titel- und Pinterest-Bilder erzeugen
        run: |
          npm run titelbilder
          npm run pins

      - name: Bauen
        run: npm run build

      - name: Prüfen (fremde Server, Handy-Breite)
        run: npm run check

      - name: Prüfen (HTML und Barrierefreiheit)
        run: npm run qualitaet

      - name: Prüfen (interne Links)
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: nur Links innerhalb der Seite. Links mit „#…=“ sind Rechner- und Such-Parameter, keine Sprungmarken.
          args: >-
            --offline --no-progress --include-fragments
            --root-dir ${{ github.workspace }}/blog/site/dist
            --exclude-path blog/site/dist/pagefind
            --exclude '#[^/]*='
            'blog/site/dist/**/*.html'
          fail: true
          jobSummary: false

      - name: Fertige Seite für den Upload ablegen
        uses: actions/upload-artifact@v6
        with:
          name: website
          path: blog/site/dist
          include-hidden-files: true
          retention-days: 7

  hochladen:
    name: Zu IONOS hochladen
    needs: pruefen
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.hochladen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Zugangsdaten vorhanden?
        id: zugang
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          if [ -n "$SFTP_HOST" ] && [ -n "$SFTP_USER" ] && [ -n "$SFTP_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::IONOS-Zugangsdaten fehlen (Secrets IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD). Upload übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.zugang.outputs.ok == 'true'
        with:
          sparse-checkout: blog/site/scripts

      - name: Fertige Seite holen
        if: steps.zugang.outputs.ok == 'true'
        uses: actions/download-artifact@v7
        with:
          name: website
          path: blog/site/dist

      - name: Sicherheitsprüfung vor dem Upload
        if: steps.zugang.outputs.ok == 'true'
        working-directory: blog/site/dist
        run: |
          test -s index.html
          test -s sitemap-0.xml
          test -s .htaccess
          test "$(find . -name index.html | wc -l)" -ge 50
          echo "OK: $(find . -name index.html | wc -l) Seiten, $(du -sh . | cut -f1) insgesamt."

      - name: lftp installieren
        if: steps.zugang.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP hochladen
        if: steps.zugang.outputs.ok == 'true'
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          SFTP_ZIEL: ${{ vars.IONOS_SFTP_ZIEL || '/' }}
        # Eingaben bereinigen, falls beim Eintragen der Secrets „sftp://“, ein Port, Leerzeichen oder ein Zeilenumbruch mitkopiert wurde.
        # Die Werte selbst werden nie ausgegeben, nur Hinweise, was korrigiert wurde.
        # mirror --reverse lädt den Inhalt von dist/ in das Zielverzeichnis. Ohne --delete: Auf dem Server wird nichts gelöscht.
        run: |
          HOST="$(printf '%s' "$SFTP_HOST" | tr -d '[:space:]')"
          [ "$HOST" != "$SFTP_HOST" ] && echo "Hinweis: Leerzeichen oder Zeilenumbruch im Servernamen entfernt."
          case "$HOST" in *://*) echo "Hinweis: Protokoll (z. B. sftp://) vor dem Servernamen entfernt."; HOST="${HOST#*://}";; esac
          HOST="${HOST%%/*}"
          PORT=22
          case "$HOST" in *:*) PORT="${HOST##*:}"; HOST="${HOST%%:*}"; echo "Hinweis: Port aus dem Servernamen übernommen.";; esac
          echo "::add-mask::$HOST"
          BENUTZER="$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')"
          [ "$BENUTZER" != "$SFTP_USER" ] && echo "Hinweis: Leerzeichen im Benutzernamen entfernt."
          echo "::add-mask::$BENUTZER"
          LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"
          export LFTP_PASSWORD
          if ! getent hosts "$HOST" > /dev/null; then
            echo "::error::Der Servername aus IONOS_SFTP_HOST ist nicht erreichbar. Bitte nur den Namen eintragen, z. B. access-123456.webspace-host.com"
            exit 1
          fi
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$BENUTZER\" -p $PORT sftp://$HOST;
            mirror --reverse --no-perms --parallel=4 --verbose=1 blog/site/dist \"$SFTP_ZIEL\";
            bye"

      - name: Live-Check
        if: steps.zugang.outputs.ok == 'true'
        run: |
          sleep 5
          for pfad in / /artikel/ /rechner/ /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://handwerksdoktor.de$pfad")
            echo "$code  $pfad"
            test "$code" = 200
          done

      - name: Bei IndexNow melden (Bing & Co.)
        # Nachts ändern sich nur die Pinterest-Feeds, dafür nicht alle Seiten neu melden.
        if: steps.zugang.outputs.ok == 'true' && github.event_name != 'schedule'
        continue-on-error: true
        working-directory: blog/site
        run: node scripts/indexnow.mjs

  berichte:
    name: Berichte (Quellen, Rechtschreibung, Pakete)
    needs: pruefen
    # Nachts nicht: Es hat sich am Inhalt nichts geändert.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nur zur Info: Fehler hier stoppen keinen Upload und färben den Lauf nicht rot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fertige Seite holen
        uses: actions/download-artifact@v7
        with:
          name: website
          path: blog/site/dist

      - name: Externe Quellenlinks prüfen
        uses: lycheeverse/lychee-action@v2
        with:
          # Amazon bewusst ausgenommen: kein automatisches Abrufen von Amazon-Seiten (Partnerprogramm).
          # 403 und 429 gelten als erreichbar, viele Seiten blocken Prüfprogramme.
          args: >-
            --no-progress --max-concurrency 8 --timeout 25 --max-retries 2
            --accept '200..=299,403,429'
            --root-dir ${{ github.workspace }}/blog/site/dist
            --exclude '^file://' --exclude 'amazon\.' --exclude 'handwerksdoktor\.de' --exclude 'youtube\.com'
            --exclude-path blog/site/dist/pagefind
            'blog/site/dist/**/*.html'
          fail: false
          jobSummary: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rechtschreibung (LanguageTool)
        working-directory: blog/site
        env:
          ALLE: ${{ github.event_name != 'push' && inputs.alle_artikel || 'false' }}
          VORHER: ${{ github.event.before }}
        run: |
          if [ "$ALLE" = "true" ] || [ -z "$VORHER" ] || [ "$VORHER" = "0000000000000000000000000000000000000000" ]; then
            ARTIKEL=""
            echo "Prüfe alle Artikel."
          else
            ARTIKEL=$(git diff --name-only "$VORHER" "$GITHUB_SHA" -- src/content/artikel | sed -n 's|^blog/site/src/content/artikel/\(.*\)\.mdx$|\1|p' | tr '\n' ' ')
            if [ -z "$ARTIKEL" ]; then echo "Keine Artikel geändert."; exit 0; fi
            echo "Geänderte Artikel: $ARTIKEL"
          fi
          node scripts/rechtschreibung.mjs --nur-bericht $ARTIKEL

      - name: Sicherheitslücken in Paketen (npm audit)
        working-directory: blog/site
        run: |
          {
            echo "### npm audit (nur Prüf- und Bauwerkzeuge, nichts davon läuft auf der Website)"
            echo '```'
            npm audit --omit=optional 2>&1 | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
